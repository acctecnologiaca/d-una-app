<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Respuesta de Orden - D-UNA</title>
  <style>
    :root {
      --bg: #F1F5F9;
      --card: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --border: #E2E8F0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      max-width: 460px;
      width: 100%;
      padding: 40px 28px 32px;
      text-align: center;
    }
    .badge {
      width: 76px; height: 76px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 14px;
      line-height: 1.3;
    }
    .msg {
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .msg strong { color: var(--text); }
    .footer {
      border-top: 1px solid var(--border);
      padding-top: 18px;
      font-size: 11px;
      color: #94A3B8;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid var(--border);
      border-top-color: #3B82F6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="heading">Procesando solicitud...</h1>
    <p class="msg" id="message">Validando su respuesta con el sistema D-UNA.</p>
    <div class="footer">
      <img src="https://fdkswvzrozijbizdthge.supabase.co/storage/v1/object/sign/app_images/logo_d_una.png?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV8yNjZhOWZkMS0xYWQyLTQ3OWEtOGNlYS1kYjQzMjA0OGNlMjkiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJhcHBfaW1hZ2VzL2xvZ29fZF91bmEucG5nIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc4NTI2NTY0NSwiZXhwIjo0OTM4ODY1NjQ1fQ.2vHh0Q0-FA0ZQDV-HeBtlf6CKCS7jrPI5CIFjK7yPVw" alt="D-UNA" style="height: 24px; margin-bottom: 8px; vertical-align: middle;"><br>
      Sistema Transaccional D-UNA &bull; Gestión Operativa
    </div>
  </div>

  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const action = params.get('action');

      const badge = document.getElementById('badge');
      const spinner = document.getElementById('spinner');
      const heading = document.getElementById('heading');
      const message = document.getElementById('message');
      const card = document.getElementById('card');

      if (!token || !action) {
        showResult('error', '⚠️', 'Enlace Inválido',
          'Los parámetros de seguridad requeridos no están presentes en la solicitud.');
        return;
      }

      try {
        const apiUrl = 'https://fdkswvzrozijbizdthge.supabase.co/functions/v1/orders_action';
        const res = await fetch(`${apiUrl}?token=${encodeURIComponent(token)}&action=${encodeURIComponent(action)}`);
        const data = await res.json();

        if (data.status === 'approved') {
          showResult('success', 'status_approved.png', '¡Orden Aprobada Exitosamente!',
            `Gracias por su respuesta. La orden <strong>${esc(data.order_number)}</strong> ha sido marcada como <strong>APROBADA</strong> en el sistema D-UNA.`);
        } else if (data.status === 'rejected') {
          showResult('rejected', 'status_rejected.png', 'Orden Rechazada / Stock Incompleto',
            `Gracias por su respuesta. La orden <strong>${esc(data.order_number)}</strong> ha sido marcada como <strong>RECHAZADA / STOCK INCOMPLETO</strong> en el sistema D-UNA.`);
        } else if (data.status === 'already_processed') {
          const isApp = data.current_status === 'approved';
          const iconImg = isApp ? 'status_approved.png' : 'status_rejected.png';
          const st = isApp ? 'APROBADA' : 'RECHAZADA';
          showResult(isApp ? 'success' : 'rejected', iconImg, `Orden ${esc(data.order_number)} ya fue registrada`,
            `Esta orden fue marcada como <strong>${st}</strong> anteriormente.`);
        } else if (data.status === 'expired') {
          showResult('warning', 'status_expired.png', 'Enlace Expirado (72h)',
            `El plazo de 72 horas para responder a la orden <strong>${esc(data.order_number)}</strong> ha vencido. Solicite un nuevo reenvío al comprador.`);
        } else {
          showResult('error', 'status_expired.png', 'Enlace Caducado o Inválido',
            data.message || 'Este enlace ya no es válido o ha sido utilizado previamente.');
        }
      } catch (err) {
        showResult('error', 'status_cancelled.png', 'Error de Conexión',
          'No se pudo conectar con el servidor. Por favor intente nuevamente.');
      }

      function showResult(type, iconSrc, title, msg) {
        spinner.remove();

        const badgeEl = document.createElement('div');
        badgeEl.className = 'badge';
        badgeEl.style.backgroundColor = 'transparent';
        
        const imgEl = document.createElement('img');
        imgEl.src = iconSrc;
        imgEl.style.width = '72px';
        imgEl.style.height = '72px';
        imgEl.style.objectFit = 'contain';
        badgeEl.appendChild(imgEl);

        card.insertBefore(badgeEl, heading);

        heading.textContent = title;
        message.innerHTML = msg;
        document.title = `${title} - D-UNA`;
      }

      function esc(str) {
        const d = document.createElement('div');
        d.textContent = str || '';
        return d.innerHTML;
      }
    })();
  </script>
</body>
</html>
